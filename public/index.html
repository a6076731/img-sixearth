<!doctype html>
<html lang="zh-CN">
<head>

<body>

<header class="head">
  <div class="brand">
    <span class="brand-title">相册</span>
    <span class="brand-count" id="count"></span>
  </div>
  <nav class="nav">
    <a href="https://sixearth.cn/">首页</a>
    <a href="https://blog.sixearth.cn/">博客</a>
    <a href="/" class="is-current" aria-current="page">相册</a>
  </nav>
</header>

<main class="wall" id="wall" aria-label="照片列表"></main>

<p class="empty" id="empty" hidden>还没有照片。</p>

<footer class="foot">
  <span id="foot"></span>
  <a class="mail" href="mailto:hi@sixearth.cn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="5" width="19" height="14" rx="2.5"></rect>
      <path d="m3.2 6.6 8.8 6 8.8-6"></path>
    </svg>
    <span>来信 hi@sixearth.cn</span>

    <span class="lb-date" id="lbDate"></span>
    <button class="lb-close" id="lbClose" type="button" aria-label="关闭">&times;</button>
  </div>
  <img class="lb-img" id="lbImg" alt="">
  <div class="lb-tools">
    <button class="lb-nav" id="lbPrev" type="button" aria-label="上一张">&#8249;</button>
    <span class="lb-pos" id="lbPos"></span>
    <button class="lb-nav" id="lbNext" type="button" aria-label="下一张">&#8250;</button>
  </div>
</dialog>

<script src="/assets/app.js?v=20261025a" defer></script>
